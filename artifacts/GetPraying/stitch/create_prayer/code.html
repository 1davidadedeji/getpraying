<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Prayer - GetPraying</title>

                "surface": "#faf9f8",

                "on-primary-fixed-variant": "#004b71",
                "surface-dim": "#dadad9",
                "surface-container-high": "#e9e8e7",
                "on-secondary": "#ffffff",
                "on-tertiary-container": "#856a00",
                "error": "#ba1a1a",
                "tertiary-fixed-dim": "#e9c349",
                "on-secondary-container": "#636451",
                "on-primary-fixed": "#001e30",
                "on-error-container": "#93000a",
                "on-primary": "#ffffff",
                "surface-tint": "#21638d",
                "secondary-fixed-dim": "#c8c8b0",

              fontFamily: {

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-noto-serif { font-family: 'Noto Serif', serif; }
        .font-plus-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .bg-soul-gradient { background: linear-gradient(45deg, #21638d, #e5f1ff); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar (Suppressed for focused task, replaced with simple header) -->
<header class="w-full top-0 sticky z-50 flex items-center justify-between px-6 py-4 bg-[#f4f3f2] dark:bg-slate-900">
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-[#e5f1ff] transition-colors">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<h1 class="font-noto-serif text-2xl font-bold text-[#21638d] dark:text-blue-400">GetPraying</h1>
<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow flex flex-col px-6 pt-8 pb-32 max-w-2xl mx-auto w-full">
<!-- Editorial Headline -->
<section class="mb-10">
<h2 class="font-noto-serif text-[2.5rem] leading-tight text-primary font-bold mb-2">Speak your heart</h2>
<p class="text-on-surface-variant body-lg leading-relaxed">Your words are a bridge to the divine. Take a breath and begin.</p>
</section>
<!-- Main Input Canvas -->
<div class="flex-grow flex flex-col space-y-8">
<div class="relative group">
<textarea class="w-full min-h-[300px] p-8 text-xl font-noto-serif bg-surface-container-lowest rounded-xl border-none focus:ring-4 focus:ring-primary/10 transition-all resize-none shadow-[0_4px_30px_rgba(33,99,141,0.03)] placeholder:text-outline-variant leading-relaxed" placeholder="Write your prayer..."></textarea>
<div class="absolute bottom-6 right-8 text-outline text-sm font-label">Tap to begin</div>
</div>
<!-- Category Selector -->
<section>
<label class="block font-label text-sm font-semibold text-primary uppercase tracking-widest mb-4 px-2">Choose a path</label>
<div class="flex flex-wrap gap-3">
<button class="px-6 py-3 rounded-full bg-primary-container text-primary font-medium hover:bg-primary-fixed transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-lg">favorite</span>
                        Gratitude
                    </button>
<button class="px-6 py-3 rounded-full bg-surface-container-high text-on-surface-variant font-medium hover:bg-surface-container-highest transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-lg">air</span>
                        Anxiety
                    </button>
<button class="px-6 py-3 rounded-full bg-surface-container-high text-on-surface-variant font-medium hover:bg-surface-container-highest transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-lg">medical_services</span>
                        Healing
                    </button>
<button class="px-6 py-3 rounded-full bg-surface-container-high text-on-surface-variant font-medium hover:bg-surface-container-highest transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-lg">wb_sunny</span>
                        Guidance
                    </button>
</div>
</section>
<!-- Toggles & Options -->
<section class="bg-surface-container-low rounded-lg p-6 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center">
<span class="material-symbols-outlined text-primary">visibility_off</span>
</div>
<div>
<h4 class="font-semibold text-on-surface">Post anonymously</h4>
<p class="text-xs text-on-surface-variant">Hide your profile from the community</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary"></div>
</label>
</section>
</div>
</main>
<!-- Fixed Action Bar -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none">
<div class="max-w-2xl mx-auto pointer-events-auto">
<button class="w-full py-5 rounded-full bg-soul-gradient text-white font-bold text-lg shadow-xl shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-weight="fill">send</span>
                Share Prayer
            </button>
</div>
</div>
<!-- Background Decoration (Ethereal Aura) -->
<div class="fixed top-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary-container/20 rounded-full blur-[120px] -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-tertiary-container/30 rounded-full blur-[100px] -z-10"></div>
</body></html>
