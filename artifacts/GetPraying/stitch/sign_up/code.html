<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GetPraying - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;0,900;1,900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error": "#ba1a1a",
              "surface-container-low": "#f4f3f2",
              "on-primary-container": "#34729c",
              "on-primary-fixed": "#001e30",
              "tertiary-container": "#ffefc9",
              "surface-bright": "#faf9f8",
              "secondary-fixed": "#e4e4cc",
              "surface": "#faf9f8",
              "inverse-on-surface": "#f1f0f0",
              "tertiary-fixed-dim": "#e9c349",
              "on-primary": "#ffffff",
              "on-surface-variant": "#43474a",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "on-secondary-fixed": "#1b1d0e",
              "on-secondary-fixed-variant": "#474836",
              "on-tertiary-fixed-variant": "#574500",
              "on-primary-fixed-variant": "#004b71",
              "secondary-container": "#e1e1c9",
              "surface-variant": "#e3e2e1",
              "surface-dim": "#dadad9",
              "inverse-surface": "#2f3130",
              "on-tertiary": "#ffffff",
              "tertiary": "#735c00",
              "primary": "#21638d",
              "outline": "#73787b",
              "inverse-primary": "#93cdfc",
              "on-tertiary-container": "#856a00",
              "surface-container": "#eeeeed",
              "on-background": "#1a1c1c",
              "outline-variant": "#c3c7cb",
              "surface-container-high": "#e9e8e7",
              "primary-container": "#e5f1ff",
              "primary-fixed-dim": "#93cdfc",
              "primary-fixed": "#cbe6ff",
              "on-tertiary-fixed": "#241a00",
              "on-error-container": "#93000a",
              "surface-tint": "#21638d",
              "surface-container-lowest": "#ffffff",
              "on-surface": "#1a1c1c",
              "tertiary-fixed": "#ffe088",
              "background": "#faf9f8",
              "on-secondary": "#ffffff",
              "secondary": "#5e604d",
              "secondary-fixed-dim": "#c8c8b0",
              "on-secondary-container": "#636451",
              "surface-container-highest": "#e3e2e1"
            },
            fontFamily: {
              "headline": ["Noto Serif"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .serif-display {
        font-family: 'Noto Serif', serif;
      }
      .aura-glow {
        background: radial-gradient(circle at top right, rgba(229, 241, 255, 0.8), transparent 70%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col overflow-x-hidden">
<!-- Top Navigation (Contextual Suppression of Shell applies for Sign Up) -->
<header class="flex justify-between items-center w-full px-6 py-6 z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="auto_awesome">auto_awesome</span>
<h1 class="text-primary font-headline font-black italic text-2xl tracking-tight">GetPraying</h1>
</div>
<button class="text-primary font-medium text-sm hover:opacity-80 transition-opacity">
            Log in
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col px-8 pb-12 aura-glow">
<!-- Hero Section / Editorial Intro -->
<section class="mt-8 mb-12">
<div class="space-y-4">
<h2 class="font-headline font-bold text-4xl text-on-surface leading-tight tracking-tight">
                    Create your <br/>digital sanctuary.
                </h2>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-xs">
                    Join a community built on peace, reflection, and intentional connection.
                </p>
</div>
</section>
<!-- Form Section -->
<section class="flex flex-col gap-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-widest text-on-surface-variant ml-4" for="email">
                    Email
                </label>
<div class="relative group">
<input class="w-full h-16 px-6 rounded-xl bg-surface-container-high border-none text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all duration-300 outline-none" id="email" placeholder="you@sanctuary.com" type="email"/>
</div>
</div>
<!-- Username Field -->
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-widest text-on-surface-variant ml-4" for="username">
                    Username
                </label>
<div class="relative group">
<input class="w-full h-16 px-6 rounded-xl bg-surface-container-high border-none text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all duration-300 outline-none" id="username" placeholder="your_name" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-widest text-on-surface-variant ml-4" for="password">
                    Password
                </label>
<div class="relative group">
<input class="w-full h-16 px-6 rounded-xl bg-surface-container-high border-none text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all duration-300 outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-6 top-1/2 -translate-y-1/2 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- CTA Section -->
<div class="pt-6 space-y-6">
<button class="w-full h-16 bg-primary text-on-primary rounded-full font-bold text-lg shadow-[0_10px_40px_rgba(33,99,141,0.2)] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
                    Continue
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center text-on-surface-variant text-sm px-4">
                    By continuing, you agree to our 
                    <a class="text-primary font-medium hover:underline" href="#">Terms of Service</a> 
                    and 
                    <a class="text-primary font-medium hover:underline" href="#">Privacy Policy</a>.
                </p>
</div>
</section>
<!-- Aesthetic Anchor (Bottom Decor) -->
<div class="mt-auto pt-12 flex justify-center items-center gap-4 opacity-40">
<div class="h-[1px] w-12 bg-outline-variant"></div>
<span class="material-symbols-outlined text-primary text-sm" data-icon="spa">spa</span>
<div class="h-[1px] w-12 bg-outline-variant"></div>
</div>
</main>
<!-- Visual Vellum Overlay (Subtle Depth) -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none z-[-1] opacity-20">
<div class="absolute top-1/4 right-[-10%] w-96 h-96 bg-primary-fixed rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-80 h-80 bg-tertiary-fixed rounded-full blur-[80px]"></div>
</div>
</body></html>
