# share.getpraying.com — proxy to the same Express process as api.getpraying.com.
# Required for: /post/* OG previews, /.well-known/assetlinks.json (Android App Links),
# and /.well-known/apple-app-site-association (iOS Universal Links).
#
# After enabling this vhost, set on the API server:
#   SHARE_WEB_ORIGIN=https://share.getpraying.com
#   ANDROID_CERT_FINGERPRINT=<SHA256 from EAS: eas credentials -p android>
#   (comma-separate multiple fingerprints for preview + production keystores)

server {
  listen 443 ssl http2;
  server_name share.getpraying.com;

  client_max_body_size 0;

  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
