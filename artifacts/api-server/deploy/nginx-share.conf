# share.getpraying.com must proxy to the SAME Node API process as api.getpraying.com.
# shareRouter is mounted at the Express root (see src/app.ts) — not under /api.
#
# Without this, share.getpraying.com may hit a stale/parking app and return
# "Cannot GET /post/123" even though the API serves those routes correctly.
#
# Example server block (adjust upstream port to match your PM2/systemd service):

