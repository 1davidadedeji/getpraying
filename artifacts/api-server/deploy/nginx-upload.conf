# Snippet for the nginx server block that proxies api.getpraying.com (and share.getpraying.com).
# Default client_max_body_size is 1m — mobile post audio (15 MB) and video (50 MB) uploads
# fail with 413 HTML (apps show a generic upload failure because the proxy drops the body).
#
# Apply inside the location that proxy_passes to the Node API, then reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 0;
