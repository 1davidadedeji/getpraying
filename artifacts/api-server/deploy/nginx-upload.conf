# Snippet for the nginx server block that proxies api.getpraying.com.
# Default client_max_body_size is 1m — larger audio uploads fail with 413 HTML
# (browsers show this as "Failed to fetch" because CORS headers are missing).
#
# Apply inside the location that proxy_passes to the Node API, then reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 0;
