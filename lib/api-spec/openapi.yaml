openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GetPraying API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: content
    description: Public content (daily word, etc.)
  - name: auth
    description: Authentication
  - name: users
    description: User profiles
  - name: posts
    description: Prayer posts
  - name: prayers
    description: Prayers (library)
  - name: notifications
    description: Notifications
  - name: admin
    description: Moderation/admin
  - name: search
    description: Search users and prayers

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/subscription-prompt-dismissed:
    post:
      operationId: dismissSubscriptionPrompt
      tags: [auth]
      summary: Record that the user dismissed the recurring subscription upsell
      responses:
        "200":
          description: Dismiss recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/preferences:
    post:
      operationId: savePreferences
      tags: [auth]
      summary: Save onboarding prayer category preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesInput"
      responses:
        "200":
          description: Preferences saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify email with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid/expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend OTP email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationInput"
      responses:
        "200":
          description: Sent (or masked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # USERS
  /users/{username}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get user profile by username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Now following
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  following:
                    type: boolean
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  following:
                    type: boolean
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{username}/posts:
    get:
      operationId: getUserPosts
      tags: [users]
      summary: Get posts by a specific user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: User posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"

  /users/{username}/saved-posts:
    get:
      operationId: getUserSavedPosts
      tags: [users]
      summary: Get a user's saved feed posts (approved only, most recently saved first)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Saved posts visible on the user's public Saved tab
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPostsList"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # POSTS / FEED
  /posts:
    get:
      operationId: getPosts
      tags: [posts]
      summary: Get approved posts feed
      parameters:
        - name: cursor
          in: query
          description: Opaque keyset cursor returned as PostsPage.nextCursor
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
        - name: personalize
          in: query
          description: When true and the user is authenticated, return only posts in their preferred categories
          schema:
            type: boolean
      responses:
        "200":
          description: Feed posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"

    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new prayer post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Post created (pending moderation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/trending:
    get:
      operationId: getTrendingPosts
      tags: [posts]
      summary: Get trending posts by prayer count
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Trending posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /posts/stats:
    get:
      operationId: getFeedStats
      tags: [posts]
      summary: Get feed stats (active prayers, total today, by category)
      responses:
        "200":
          description: Feed stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedStats"

  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Search users and approved prayers
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Matching users and posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /posts/{postId}/boost:
    post:
      operationId: boostPost
      tags: [posts]
      summary: Boost a post (premium) — prioritizes in feed and notifies all users
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post boosted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoostPostResponse"
        "402":
          description: Subscription required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a single post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete own post (or staff may delete another user's post with a reason)
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePostInput"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Missing reason for staff deletion of someone else's post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/{postId}/pray:
    post:
      operationId: prayForPost
      tags: [posts]
      summary: Pray for a post (like/prayer reaction)
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prayer count updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayResponse"

  /posts/{postId}/save:
    post:
      operationId: savePost
      tags: [posts]
      summary: Save a post to prayer library
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavePostStateResponse"

    delete:
      operationId: unsavePost
      tags: [posts]
      summary: Remove post from saved library
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unsaved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavePostStateResponse"

  /posts/{postId}/comments:
    get:
      operationId: getPostComments
      tags: [posts]
      summary: Get comments for a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostCommentsResponse"
    post:
      operationId: createPostComment
      tags: [posts]
      summary: Add a comment to a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCommentResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # PRAYER LIBRARY
  /library/official:
    get:
      operationId: getOfficialPrayers
      tags: [prayers]
      summary: Get official curated prayers/guides
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Official prayers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficialPrayer"

  /library/official/{id}:
    get:
      operationId: getOfficialPrayerById
      tags: [prayers]
      summary: Get one official prayer by id (detail / saved deep link)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Official prayer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficialPrayerDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /library/saved:
    get:
      operationId: getSavedPrayers
      tags: [prayers]
      summary: Get current user's saved prayers/scrolls
      responses:
        "200":
          description: Saved prayers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /library/paths:
    get:
      operationId: getPaths
      tags: [prayers]
      summary: Get prayer paths/journeys
      responses:
        "200":
          description: Prayer paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrayerPath"

  /library/paths/{pathId}:
    get:
      operationId: getPath
      tags: [prayers]
      summary: Get a specific prayer path with its content
      parameters:
        - name: pathId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prayer path detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerPathDetail"

  /library/categories:
    get:
      operationId: getCategories
      tags: [prayers]
      summary: Get prayer categories with counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /daily-word:
    get:
      operationId: getDailyWord
      tags: [content]
      summary: Get daily scripture for the welcome screen
      description: Returns an admin override for the given calendar date if set; otherwise the static default (Psalm 34:17) when auto-rotation is off, or a deterministic daily rotation when auto-rotation is on.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Calendar date (YYYY-MM-DD), typically the device local date. Defaults to today on the server if omitted.
      responses:
        "200":
          description: Daily word payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyWordResponse"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ADMIN / MODERATION
  /admin/posts/pending:
    get:
      operationId: getPendingPosts
      tags: [admin]
      summary: Get posts pending moderation
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Pending posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"

  /admin/posts/moderated:
    get:
      operationId: getModeratedPosts
      tags: [admin]
      summary: Get moderated posts (approved or declined)
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Moderated posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"

  /admin/posts/{postId}/approve:
    post:
      operationId: approvePost
      tags: [admin]
      summary: Approve a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /admin/posts/{postId}/decline:
    post:
      operationId: declinePost
      tags: [admin]
      summary: Decline a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclinePostInput"
      responses:
        "200":
          description: Post declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /admin/posts/{postId}/premium:
    patch:
      operationId: adminSetPostPremium
      tags: [admin]
      summary: Mark a community post as premium or free
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isPremium]
              properties:
                isPremium:
                  type: boolean
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /admin/posts/{postId}/remove:
    delete:
      operationId: adminRemovePost
      tags: [admin]
      summary: Admin remove/delete a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Get all users for admin
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersPage"

  /admin/users/{userId}/ban:
    post:
      operationId: banUser
      tags: [admin]
      summary: Ban a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/users/{userId}/unban:
    post:
      operationId: unbanUser
      tags: [admin]
      summary: Unban a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User unbanned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin overview stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/daily-word:
    put:
      operationId: setDailyWordOverride
      tags: [admin]
      summary: Set or replace the daily word override for a calendar date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDailyWordOverrideInput"
      responses:
        "200":
          description: Saved override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyWordResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearDailyWordOverride
      tags: [admin]
      summary: Remove the daily word override for a calendar date (reverts to default rotation)
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Calendar date YYYY-MM-DD
      responses:
        "200":
          description: Cleared (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Missing or invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/daily-word/settings:
    get:
      operationId: getDailyWordSettings
      tags: [admin]
      summary: Get daily word update mode (manual vs auto rotation)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyWordSettings"
    patch:
      operationId: setDailyWordSettings
      tags: [admin]
      summary: Set daily word update mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyWordSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyWordSettings"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    SavePostStateResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        isSaved:
          type: boolean
        saveCount:
          type: integer
      required:
        - success
        - isSaved
        - saveCount

    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
