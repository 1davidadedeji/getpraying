    Post:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        mediaUrl:
          type: string
          nullable: true
        mediaType:
          type: string
          nullable: true
          enum: [image, video, audio]
        category:
          type: string
          nullable: true
        categories:
          type: array
          items:
            type: string
          description: All tag slugs for this post (primary is usually first)
        isAnonymous:
          type: boolean
        status:
          type: string
          enum: [pending, approved, declined]
        flagReason:
          type: string
          nullable: true
        moderationReason:
          type: string
          nullable: true
          description: Shown to the author when a moderator declines the post
        prayCount:
          type: integer
        commentCount:
          type: integer
        saveCount:
          type: integer
        hasPrayed:
          type: boolean
        hasCommented:
          type: boolean
        isSaved:
          type: boolean
        authorId:
          type: integer
          nullable: true
        authorUsername:
          type: string
          nullable: true
        authorDisplayName:
          type: string
          nullable: true
        authorAvatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        boostedAt:
          type: string
          format: date-time
          nullable: true
          description: When a premium member last boosted this post (feed priority)
        boostedByUserId:
          type: integer
          nullable: true
          description: User id of the member whose boost is currently active (for unboost toggle)
        isPremium:
          type: boolean
          description: When true, free users see a preview only; video/audio require subscription
        contentPreview:
          type: string
          nullable: true
          description: Teaser text when content is locked for the viewer
        contentLocked:
          type: boolean
          nullable: true
          description: True when the viewer cannot access full text or premium media
      required:
        - id
        - content
        - isAnonymous
        - status
        - prayCount
        - commentCount
        - saveCount
        - hasPrayed
        - hasCommented
        - isSaved
        - createdAt

